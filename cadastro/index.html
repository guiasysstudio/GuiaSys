</div></header><main>
<section class="auth-section"><div class="container auth-wrap"><div class="auth-card">
<span class="eyebrow">Conta GuiaSys</span><h1>Criar conta</h1><p class="auth-subtitle">Crie uma conta única para usar os serviços e projetos da GuiaSys.</p>
<button class="btn btn-google" id="google-register" type="button">Cadastrar com Google</button>
<div class="auth-divider"><span>ou</span></div>
<form id="register-form" class="auth-form">
<div class="field"><label for="name">Nome completo</label><input id="name" autocomplete="name" required></div>
<div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Senha</label><input id="password" type="password" minlength="6" autocomplete="new-password" required></div>
<div class="field"><label for="confirm-password">Confirmar senha</label><input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required></div>
<button class="btn btn-primary" type="submit">Criar conta</button>
</form>
<div id="auth-message" class="auth-message" aria-live="polite"></div>
<p class="auth-switch">Já possui conta? <a href="/login/">Entrar</a></p>
</div></div></section></main><footer><div class="container footer-bottom">© <span data-year></span> GuiaSys Studio. Todos os direitos reservados.</div></footer><script src="/assets/js/main.js"></script><script type="module" src="/assets/js/cadastro.js"></script></body></html>
